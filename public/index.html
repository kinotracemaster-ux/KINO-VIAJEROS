<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos - Viajeros</title>
    <link href="/vendor/tailwind.css" rel="stylesheet">
    <script defer src="/vendor/alpine.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #ffffff; overflow-x: hidden; }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 8px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    </style>
</head>
<body class="text-black antialiased selection:bg-red-200 selection:text-red-900 pb-20 md:pb-8">

    <div x-data="gastosApp()" x-init="initApp()" class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 md:pt-10">
        
        <!-- Modal Identificación Viajero -->
        <div x-show="!viajeroRegistrado" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl border border-gray-200">
                <h2 class="text-2xl font-bold text-black mb-6 flex items-center">
                    <span class="bg-red-100 text-red-600 p-2 rounded-xl mr-3">✈️</span>
                    Bienvenido Viajero
                </h2>
                <form @submit.prevent="registrarViajero" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-800 mb-1">Nombre Completo</label>
                        <input type="text" x-model="viajeroForm.name" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-600 focus:outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-800 mb-1">Fecha Salida</label>
                            <input type="date" x-model="viajeroForm.departure_date" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-600 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-800 mb-1">Fecha Llegada</label>
                            <input type="date" x-model="viajeroForm.arrival_date" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-600 focus:outline-none">
                        </div>
                    </div>
                    <button type="submit" class="w-full mt-4 bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl transition-all">
                        Entrar a mi plan
                    </button>
                </form>
            </div>
        </div>

        <!-- App Principal (Visible solo si está registrado) -->
        <div x-show="viajeroRegistrado" style="display: none;">
            <!-- Encabezado -->
            <header class="mb-8">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
                    <div class="text-center md:text-left">
                        <h1 class="text-3xl sm:text-4xl font-bold text-black tracking-tight flex items-center justify-center md:justify-start">
                            <span class="bg-red-100 text-red-600 p-2 rounded-xl mr-3 shadow-sm">
                                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            </span>
                            Gastos de Ruta
                        </h1>
                        <p class="text-gray-500 mt-2 font-medium">
                            Viajero: <span class="font-bold text-gray-800" x-text="viajero?.name"></span>
                        </p>
                    </div>
                    
                    <div class="bg-black p-5 rounded-2xl shadow-lg border border-gray-800 text-center md:text-right md:min-w-[280px]">
                        <p class="text-xs text-gray-400 font-semibold uppercase tracking-widest mb-1">Total Acumulado</p>
                        <p class="text-3xl sm:text-4xl font-bold text-white tracking-tight" x-text="formatearMoneda(calcularTotal())"></p>
                    </div>
                </div>
            </header>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-12 gap-6 lg:gap-8">
                <!-- Columna Izquierda: Formulario -->
                <div class="md:col-span-1 lg:col-span-5">
                    <div class="bg-white rounded-3xl shadow-sm border border-gray-200 p-6 sm:p-8 lg:sticky lg:top-6">
                        <h2 class="text-xl font-bold text-black mb-6 flex items-center">Nuevo Gasto</h2>
                        <form @submit.prevent="agregarGasto" class="space-y-5">
                            <div>
                                <label class="block text-sm font-semibold text-gray-800 mb-1.5">Fecha</label>
                                <input type="date" x-model="nuevoGasto.date" required class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-600 focus:outline-none shadow-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-800 mb-1.5">Categoría</label>
                                <select x-model="nuevoGasto.concept" required class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-600 focus:outline-none shadow-sm appearance-none">
                                    <option value="" disabled selected>Selecciona...</option>
                                    <option value="Alimentacion">🍽️ Alimentación</option>
                                    <option value="Transporte">🚌 Transporte</option>
                                    <option value="Alojamiento">🏨 Alojamiento</option>
                                    <option value="Representacion">🤝 Representación</option>
                                    <option value="Otros">📦 Otros</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-800 mb-1.5">Valor (COP)</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><span class="text-gray-500 font-medium text-lg">$</span></div>
                                    <input type="number" x-model="nuevoGasto.amount" required min="1" step="1" inputmode="numeric" class="w-full pl-9 pr-4 py-3 bg-white border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-600 focus:outline-none font-bold text-black shadow-sm">
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-800 mb-1.5">Notas</label>
                                <textarea x-model="nuevoGasto.notes" rows="2" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-600 focus:outline-none shadow-sm resize-none"></textarea>
                            </div>
                            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold text-lg py-3.5 rounded-xl transition-all shadow-md mt-2 flex justify-center items-center">
                                Registrar Gasto
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Columna Derecha: Lista -->
                <div class="md:col-span-1 lg:col-span-7">
                    <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden flex flex-col h-full min-h-[500px]">
                        <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-white/50">
                            <h2 class="text-xl font-bold text-black">Historial Reciente</h2>
                        </div>

                        <div x-show="gastos.length === 0" class="flex-1 flex flex-col items-center justify-center p-12 text-center">
                            <p class="text-lg font-bold text-gray-800">Tu historial está vacío</p>
                        </div>

                        <ul x-show="gastos.length > 0" class="divide-y divide-gray-100 custom-scrollbar overflow-y-auto flex-1 max-h-[600px]">
                            <template x-for="gasto in gastos" :key="gasto.id">
                                <li class="p-5 hover:bg-gray-50 group flex items-center justify-between">
                                    <div class="flex items-center space-x-4">
                                        <div class="w-12 h-12 rounded-2xl flex items-center justify-center text-2xl border border-gray-100" :class="obtenerColorConcepto(gasto.concept)" x-text="obtenerIconoConcepto(gasto.concept)"></div>
                                        <div>
                                            <p class="text-base font-bold text-black" x-text="gasto.concept"></p>
                                            <p class="text-sm text-gray-500" x-text="gasto.notes"></p>
                                            <p class="text-xs text-gray-400 font-bold mt-1" x-text="formatearFecha(gasto.date)"></p>
                                        </div>
                                    </div>
                                    <div class="flex flex-col items-end">
                                        <span class="text-lg font-bold text-black" x-text="formatearMoneda(gasto.amount)"></span>
                                        <button @click="eliminarGasto(gasto.id)" class="mt-2 text-red-500 text-xs font-bold md:opacity-0 md:group-hover:opacity-100 transition-opacity">Borrar</button>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="text-center mt-6 text-sm text-gray-500 font-bold">
                <a href="/admin.html" class="hover:text-red-600 underline">Acceso Administrador</a>
            </div>
        </div>
    </div>

    <script>
        function gastosApp() {
            return {
                viajeroRegistrado: false,
                viajero: null,
                gastos: [],
                viajeroForm: {
                    name: '',
                    departure_date: new Date().toISOString().split('T')[0],
                    arrival_date: new Date().toISOString().split('T')[0]
                },
                nuevoGasto: {
                    date: new Date().toISOString().split('T')[0],
                    concept: '',
                    amount: '',
                    notes: ''
                },

                initApp() {
                    const localViajero = localStorage.getItem('viajeroApp');
                    if (localViajero) {
                        this.viajero = JSON.parse(localViajero);
                        this.viajeroRegistrado = true;
                        this.cargarGastos();
                    }
                },

                async registrarViajero() {
                    try {
                        const res = await fetch('/api/travelers', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(this.viajeroForm)
                        });
                        const data = await res.json();
                        this.viajero = data;
                        localStorage.setItem('viajeroApp', JSON.stringify(data));
                        this.viajeroRegistrado = true;
                        this.cargarGastos();
                    } catch (e) {
                        console.error("Error", e);
                        alert("Error al conectar con el servidor.");
                    }
                },

                async cargarGastos() {
                    if (!this.viajero) return;
                    try {
                        const res = await fetch(`/api/travelers/${this.viajero.id}/expenses`);
                        this.gastos = await res.json();
                    } catch (e) { console.error("Error", e); }
                },

                async agregarGasto() {
                    if (this.nuevoGasto.date && this.nuevoGasto.concept && this.nuevoGasto.amount > 0) {
                        try {
                            const res = await fetch(`/api/travelers/${this.viajero.id}/expenses`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(this.nuevoGasto)
                            });
                            const data = await res.json();
                            this.gastos.unshift(data);
                            this.nuevoGasto.amount = '';
                            this.nuevoGasto.notes = '';
                        } catch (e) { console.error("Error", e); }
                    }
                },

                async eliminarGasto(id) {
                    try {
                        await fetch(`/api/expenses/${id}`, { method: 'DELETE' });
                        this.gastos = this.gastos.filter(g => g.id !== id);
                    } catch (e) { console.error("Error", e); }
                },

                calcularTotal() {
                    return this.gastos.reduce((total, gasto) => total + parseFloat(gasto.amount), 0);
                },

                formatearMoneda(valor) {
                    return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(valor);
                },

                formatearFecha(fechaString) {
                    if (!fechaString) return '';
                    const [year, month, day] = fechaString.split('-');
                    return new Date(year, month - 1, day).toLocaleDateString('es-CO', { year: 'numeric', month: 'short', day: 'numeric' });
                },

                obtenerIconoConcepto(concepto) {
                    const iconos = { 'Alimentacion': '🍽️', 'Transporte': '🚌', 'Alojamiento': '🏨', 'Representacion': '🤝', 'Otros': '📦' };
                    return iconos[concepto] || '📝';
                },

                obtenerColorConcepto(concepto) {
                    const colores = { 'Alimentacion': 'bg-gray-100 text-black', 'Transporte': 'bg-red-50 text-red-600', 'Alojamiento': 'bg-gray-100 text-gray-800', 'Representacion': 'bg-black text-white', 'Otros': 'bg-gray-200 text-black' };
                    return colores[concepto] || 'bg-gray-100 text-gray-500';
                }
            }
        }
    </script>
</body>
</html>
