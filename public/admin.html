<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0b0f">
    <title>Admin - Control de Gastos</title>
    <script defer src="/alpine.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#f4f5f7;--surface:#ffffff;--surface-2:#fafafb;
            --ink:#0b0b0f;--ink-soft:#3f3f46;--muted:#8b8b96;
            --line:#ececed;--line-strong:#e0e0e3;
            --brand:#e11d2a;--brand-dark:#b3141f;--brand-soft:#fde8e9;
            --radius:20px;--radius-sm:14px;--radius-lg:28px;
            --shadow-sm:0 1px 2px rgba(16,16,20,.06),0 1px 3px rgba(16,16,20,.05);
            --shadow-md:0 8px 24px -8px rgba(16,16,20,.18),0 2px 6px rgba(16,16,20,.06);
            --shadow-lg:0 24px 60px -20px rgba(16,16,20,.35);
            --shadow-brand:0 12px 28px -10px rgba(225,29,42,.55);
            --ease:cubic-bezier(.22,.61,.36,1);
        }
        *{box-sizing:border-box}
        body{
            margin:0;font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
            color:var(--ink);background:var(--bg);
            background-image:
                radial-gradient(1000px 480px at 100% -10%,#fdf2f2 0%,transparent 60%),
                radial-gradient(900px 460px at -10% 0%,#eef0f4 0%,transparent 55%);
            background-attachment:fixed;-webkit-font-smoothing:antialiased;
            overflow-x:hidden;padding-bottom:40px;
        }
        ::selection{background:var(--brand-soft);color:var(--brand-dark)}
        a{color:inherit;text-decoration:none}
        h1,h2,h3,p{margin:0}
        [x-cloak]{display:none!important}
        .shell{max-width:1200px;margin:0 auto;padding:28px 20px}
        @media(min-width:768px){.shell{padding:44px 32px}}

        .custom-scrollbar::-webkit-scrollbar{width:8px}
        .custom-scrollbar::-webkit-scrollbar-track{background:transparent}
        .custom-scrollbar::-webkit-scrollbar-thumb{background:#dcdce0;border-radius:20px;border:2px solid var(--surface)}
        .custom-scrollbar::-webkit-scrollbar-thumb:hover{background:#c2c2c8}

        /* header */
        .app-header{display:flex;flex-direction:column;gap:18px;margin-bottom:30px;padding-bottom:24px;border-bottom:1px solid var(--line)}
        @media(min-width:768px){.app-header{flex-direction:row;align-items:center;justify-content:space-between}}
        .brand{display:flex;align-items:center;gap:15px}
        .brand-icon{flex:none;width:54px;height:54px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:26px;
            background:linear-gradient(135deg,#17171d,#0b0b0f);box-shadow:var(--shadow-lg);border:1px solid #2a2a31}
        .brand h1{font-size:1.7rem;font-weight:900;letter-spacing:-.03em;line-height:1.05}
        .brand .sub{color:var(--muted);font-weight:500;font-size:.92rem;margin-top:3px}
        .btn-ghost{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;font-size:.9rem;font-weight:800;
            background:var(--surface);color:var(--ink-soft);border:1.5px solid var(--line-strong);border-radius:var(--radius-sm);
            box-shadow:var(--shadow-sm);cursor:pointer;transition:border-color .16s,transform .16s,color .16s}
        .btn-ghost:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-1px)}

        .layout{display:grid;grid-template-columns:1fr;gap:22px}
        @media(min-width:1000px){.layout{grid-template-columns:1fr 2fr;gap:26px}}

        .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);
            display:flex;flex-direction:column;overflow:hidden;height:76vh;min-height:520px}

        .panel-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
        .panel-head h2{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
        .count-pill{font-size:.72rem;font-weight:800;color:var(--brand-dark);background:var(--brand-soft);padding:5px 11px;border-radius:999px}

        .list{list-style:none;margin:0;padding:6px;overflow-y:auto;flex:1}

        /* traveler item */
        .traveler{padding:15px 16px;border-radius:16px;cursor:pointer;transition:background .16s var(--ease);position:relative}
        .traveler:hover{background:var(--surface-2)}
        .traveler+.traveler{margin-top:2px}
        .traveler.active{background:var(--brand-soft)}
        .traveler.active::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--brand)}
        .traveler .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
        .traveler .name{font-size:1.02rem;font-weight:800;letter-spacing:-.01em}
        .traveler .dates{font-size:.74rem;color:var(--muted);font-weight:700;margin-top:4px}
        .traveler .amount{font-size:.95rem;font-weight:800;color:var(--brand-dark);white-space:nowrap}
        .traveler .cnt{font-size:.72rem;color:#a5a5ad;font-weight:700;margin-top:3px;text-align:right}

        /* detail header (dark) */
        .detail-head{padding:24px 26px;display:flex;justify-content:space-between;align-items:center;gap:16px;
            background:linear-gradient(150deg,#17171d 0%,#0b0b0f 60%,#211013 100%);color:#fff;position:relative;overflow:hidden}
        .detail-head::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;
            background:radial-gradient(circle,rgba(225,29,42,.35) 0%,transparent 70%)}
        .detail-head h2{position:relative;font-size:1.4rem;font-weight:900;letter-spacing:-.02em}
        .detail-head .movs{position:relative;color:#9a9aa4;font-size:.85rem;font-weight:500;margin-top:3px}
        .detail-head .tot-lbl{position:relative;font-size:.66rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#8b8b96;text-align:right}
        .detail-head .tot-val{position:relative;font-size:1.9rem;font-weight:900;letter-spacing:-.03em;color:#fff;text-align:right;line-height:1;margin-top:5px}

        /* expense rows */
        .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:16px;transition:background .16s}
        .row:hover{background:var(--surface-2)}
        .row+.row{margin-top:2px}
        .row-left{display:flex;align-items:center;gap:14px;min-width:0}
        .cat-icon{flex:none;width:48px;height:48px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:22px;border:1px solid var(--line)}
        .row-info .concept{font-size:.98rem;font-weight:800;letter-spacing:-.01em}
        .row-info .notes{font-size:.85rem;color:var(--muted)}
        .row-info .date{font-size:.72rem;color:#a5a5ad;font-weight:700;margin-top:3px}
        .row .money{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;white-space:nowrap}

        .cat-alimentacion{background:#fff7ed;color:#c2410c;border-color:#fde4c9}
        .cat-transporte{background:var(--brand-soft);color:var(--brand-dark);border-color:#f8d0d3}
        .cat-alojamiento{background:#eff6ff;color:#1d4ed8;border-color:#d7e6fe}
        .cat-representacion{background:#0b0b0f;color:#fff;border-color:#0b0b0f}
        .cat-otros{background:#f3f4f6;color:#3f3f46;border-color:#e6e7ea}
        .cat-default{background:#f3f4f6;color:#8b8b96;border-color:#e6e7ea}

        .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:56px 24px;gap:10px;color:var(--muted)}
        .empty .em{font-size:48px}
        .empty p{font-weight:800;color:var(--ink-soft);font-size:1.05rem}
        .empty span{font-size:.88rem;font-weight:500}
        .msg{padding:36px 24px;text-align:center;color:var(--muted);font-weight:700}

        /* acordeón de gastos agrupados por fecha */
        .date-group{border:1px solid var(--line);border-radius:16px;margin:8px 6px;overflow:hidden;background:var(--surface)}
        .date-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 16px;cursor:pointer;transition:background .16s}
        .date-head:hover{background:var(--surface-2)}
        .date-head.open{background:var(--surface-2)}
        .date-left{display:flex;align-items:center;gap:12px;min-width:0}
        .chev{flex:none;width:18px;height:18px;color:var(--muted);transition:transform .2s var(--ease)}
        .chev.open{transform:rotate(90deg);color:var(--brand)}
        .date-title{font-size:.98rem;font-weight:800;letter-spacing:-.01em;text-transform:capitalize}
        .date-sub{font-size:.72rem;color:var(--muted);font-weight:700;margin-top:2px}
        .date-right{text-align:right;flex:none}
        .date-total{font-size:1.02rem;font-weight:800;color:var(--brand-dark);white-space:nowrap}
        .date-body{border-top:1px solid var(--line);padding:4px}

        /* boton nuevo viajero */
        .btn-add{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;font-size:.82rem;font-weight:800;
            color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-dark));border:none;border-radius:11px;
            cursor:pointer;box-shadow:var(--shadow-brand);transition:transform .16s,filter .16s}
        .btn-add:hover{transform:translateY(-1px);filter:brightness(1.05)}
        .btn-add svg{width:15px;height:15px}

        /* formulario crear viajero (colapsable) */
        .create-box{border-bottom:1px solid var(--line);background:var(--surface-2);padding:18px 18px 20px;overflow:hidden}
        .create-box .fl{display:block;font-size:.74rem;font-weight:800;color:var(--ink-soft);margin-bottom:6px;letter-spacing:.01em}
        .mini{width:100%;padding:10px 12px;font-size:.9rem;font-weight:500;color:var(--ink);background:var(--surface);
            border:1.5px solid var(--line-strong);border-radius:11px;outline:none;transition:border-color .16s,box-shadow .16s}
        .mini:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
        .mini-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .create-box .field{margin-bottom:12px}
        .btn-mini{width:100%;padding:11px;font-size:.9rem;font-weight:800;color:#fff;border:none;border-radius:11px;cursor:pointer;
            background:linear-gradient(135deg,var(--brand),var(--brand-dark));box-shadow:var(--shadow-brand);
            transition:transform .16s,filter .16s}
        .btn-mini:hover{transform:translateY(-1px);filter:brightness(1.05)}
        .form-error{color:var(--brand-dark);background:var(--brand-soft);font-size:.8rem;font-weight:700;
            padding:8px 11px;border-radius:9px;margin-bottom:10px}
        .lock-note{display:flex;align-items:center;gap:6px;font-size:.72rem;color:var(--muted);font-weight:700;margin-top:2px}

        /* boton borrar viajero */
        .del-traveler{flex:none;background:none;border:none;cursor:pointer;color:#c2c2c8;padding:4px;border-radius:8px;
            line-height:0;transition:color .16s,background .16s}
        .del-traveler:hover{color:var(--brand);background:var(--brand-soft)}
        .del-traveler svg{width:17px;height:17px}
        .traveler .top{align-items:center}

        /* pantalla de acceso admin */
        .login-overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;
            background:radial-gradient(900px 500px at 50% -10%,#211013 0%,#0b0b0f 60%);}
        .login-card{background:var(--surface);width:100%;max-width:400px;border-radius:var(--radius-lg);padding:36px 30px;
            box-shadow:var(--shadow-lg);text-align:center;animation:pop .4s var(--ease)}
        @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
        .login-badge{display:inline-flex;align-items:center;justify-content:center;width:60px;height:60px;border-radius:19px;
            font-size:28px;background:linear-gradient(135deg,#17171d,#0b0b0f);box-shadow:var(--shadow-lg);margin-bottom:18px}
        .login-card h2{font-size:1.5rem;font-weight:900;letter-spacing:-.02em;margin-bottom:4px}
        .login-card p{color:var(--muted);font-weight:500;font-size:.92rem;margin-bottom:22px}
        .login-input{width:100%;padding:14px 16px;font-size:1.15rem;font-weight:700;text-align:center;letter-spacing:.25em;
            color:var(--ink);background:var(--surface-2);border:1.5px solid var(--line-strong);border-radius:14px;outline:none;
            transition:border-color .16s,box-shadow .16s}
        .login-input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
        .login-btn{width:100%;margin-top:14px;padding:14px;font-size:1rem;font-weight:800;color:#fff;border:none;border-radius:14px;
            cursor:pointer;background:linear-gradient(135deg,var(--brand),var(--brand-dark));box-shadow:var(--shadow-brand);
            transition:transform .16s,filter .16s}
        .login-btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
        .login-error{color:var(--brand-dark);background:var(--brand-soft);font-size:.85rem;font-weight:700;
            padding:9px 12px;border-radius:10px;margin-bottom:14px}
        .login-back{display:inline-block;margin-top:18px;font-size:.82rem;font-weight:700;color:var(--muted)}
        .login-back:hover{color:var(--brand)}

        /* pestañas Viajeros / Correrías */
        .tabs{display:flex;gap:8px;margin-bottom:22px}
        .tab{display:inline-flex;align-items:center;gap:7px;padding:11px 18px;font-size:.92rem;font-weight:800;color:var(--ink-soft);
            background:var(--surface);border:1.5px solid var(--line-strong);border-radius:14px;cursor:pointer;box-shadow:var(--shadow-sm);
            transition:border-color .16s,color .16s,background .16s}
        .tab:hover{border-color:var(--brand);color:var(--brand)}
        .tab.active{background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;border-color:transparent;box-shadow:var(--shadow-brand)}

        /* delta vs correría anterior */
        .delta{font-size:.72rem;font-weight:800;margin-top:3px;white-space:nowrap}
        .delta.up{color:var(--brand-dark)}   /* gastó más */
        .delta.down{color:var(--ok)}         /* gastó menos */
        .delta.flat{color:var(--muted)}

        /* bloque de comparación */
        .compare{margin:8px;padding:15px 16px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2)}
        .compare-head{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.85rem;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
        .compare-head b{color:var(--ink)}
        .compare-total{font-weight:800;white-space:nowrap}
        .compare-row{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:7px 0;font-size:.85rem;border-top:1px dashed var(--line-strong)}
        .c-cat{font-weight:700;text-transform:capitalize}
        .c-prev{color:var(--muted);font-weight:600;text-align:right;min-width:70px}
        .c-arrow{font-weight:800;text-align:center;min-width:18px}
        .c-now{font-weight:800;text-align:right;min-width:70px}
        .up-txt{color:var(--brand-dark)}
        .down-txt{color:var(--ok)}
        .flat-txt{color:var(--muted)}
        .compare-none{font-size:.85rem;color:var(--muted);font-weight:600;text-align:center;padding:4px}
    </style>
</head>
<body>

    <div x-data="adminApp()" x-init="initApp()" x-cloak>

        <!-- Pantalla de acceso (solo si NO está autenticado) -->
        <div x-show="!autenticado" class="login-overlay">
            <div class="login-card">
                <div class="login-badge">🔒</div>
                <h2>Acceso Administrador</h2>
                <p>Ingresa la clave para gestionar los viajeros.</p>
                <div class="login-error" x-show="loginError" x-text="loginError"></div>
                <form @submit.prevent="login()">
                    <input type="password" class="login-input" x-model="loginPassword" placeholder="••••" inputmode="numeric" autofocus>
                    <button type="submit" class="login-btn" x-text="verificando ? 'Verificando…' : 'Entrar'"></button>
                </form>
                <a href="/index.html" class="login-back">← Volver a Viajeros</a>
            </div>
        </div>

    <!-- Panel (solo si está autenticado) -->
    <div x-show="autenticado" class="shell" style="display:none">

        <!-- Encabezado -->
        <header class="app-header">
            <div class="brand">
                <span class="brand-icon">👑</span>
                <div>
                    <h1>Panel Administrativo</h1>
                    <p class="sub">Control general de gastos de viajeros</p>
                </div>
            </div>
            <div style="display:flex;gap:10px">
                <a href="/index.html" class="btn-ghost">
                    <svg width="17" height="17" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Viajeros
                </a>
                <button class="btn-ghost" @click="logout()">
                    <svg width="17" height="17" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Salir
                </button>
            </div>
        </header>

        <!-- Pestañas -->
        <div class="tabs">
            <button class="tab" :class="{'active': vista === 'viajeros'}" @click="vista = 'viajeros'">👥 Viajeros</button>
            <button class="tab" :class="{'active': vista === 'correrias'}" @click="vista = 'correrias'; cargarCorrerias()">🗺️ Correrías</button>
        </div>

        <!-- ===== VISTA VIAJEROS ===== -->
        <div class="layout" x-show="vista === 'viajeros'">
            <!-- Lista de Viajeros -->
            <div class="card">
                <div class="panel-head">
                    <h2>Viajeros Activos</h2>
                    <button class="btn-add" @click="toggleForm()">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M12 4v16m8-8H4"></path></svg>
                        <span x-text="mostrarForm ? 'Cerrar' : 'Nuevo'"></span>
                    </button>
                </div>

                <!-- Formulario crear viajero -->
                <div class="create-box" x-show="mostrarForm" x-transition style="display:none">
                    <div class="form-error" x-show="formError" x-text="formError"></div>
                    <form @submit.prevent="crearViajero()">
                        <div class="field">
                            <label class="fl">Nombre del viajero</label>
                            <input type="text" class="mini" x-model="nuevoViajero.name" placeholder="Ej. Camilo" required>
                        </div>
                        <div class="mini-row field">
                            <div>
                                <label class="fl">Salida</label>
                                <input type="date" class="mini" x-model="nuevoViajero.departure_date" required>
                            </div>
                            <div>
                                <label class="fl">Llegada</label>
                                <input type="date" class="mini" x-model="nuevoViajero.arrival_date" required>
                            </div>
                        </div>
                        <button type="submit" class="btn-mini" x-text="creando ? 'Creando…' : 'Crear viajero'"></button>
                    </form>
                </div>

                <div x-show="viajeros.length === 0" class="msg">No hay viajeros registrados aún.</div>
                <ul class="list custom-scrollbar">
                    <template x-for="v in viajeros" :key="v.id">
                        <li @click="seleccionarViajero(v)" class="traveler" :class="{'active': viajeroSeleccionado?.id === v.id}">
                            <div class="top">
                                <div style="min-width:0">
                                    <p class="name" x-text="v.name"></p>
                                    <p class="dates" x-text="`${formatearFecha(v.departure_date)} — ${formatearFecha(v.arrival_date)}`"></p>
                                </div>
                                <div style="display:flex;align-items:center;gap:10px">
                                    <div style="text-align:right">
                                        <p class="amount" x-text="formatearMoneda(v.total_expenses)"></p>
                                        <p class="cnt" x-text="`${v.expense_count} gastos`"></p>
                                    </div>
                                    <button class="del-traveler" @click.stop="borrarViajero(v)" title="Borrar viajero">
                                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </div>
                            </div>
                        </li>
                    </template>
                </ul>
            </div>

            <!-- Detalle -->
            <div class="card">
                <template x-if="!viajeroSeleccionado">
                    <div class="empty">
                        <span class="em">👆</span>
                        <p>Selecciona un viajero</p>
                        <span>Elige alguien de la lista para ver sus gastos.</span>
                    </div>
                </template>

                <template x-if="viajeroSeleccionado">
                    <div style="display:flex;flex-direction:column;height:100%">
                        <div class="detail-head">
                            <div>
                                <h2 x-text="`Gastos de ${viajeroSeleccionado.name}`"></h2>
                                <p class="movs" x-text="`${gastosActivos.length} movimientos registrados`"></p>
                            </div>
                            <div>
                                <p class="tot-lbl">Total Gastado</p>
                                <p class="tot-val" x-text="formatearMoneda(viajeroSeleccionado.total_expenses)"></p>
                            </div>
                        </div>

                        <div class="list custom-scrollbar">
                            <div x-show="gastosActivos.length === 0" class="msg">Este viajero no tiene gastos registrados.</div>

                            <template x-for="grupo in gastosPorFecha()" :key="grupo.fecha">
                                <div class="date-group">
                                    <!-- Cabecera de la fecha (clic para desplegar) -->
                                    <div class="date-head" :class="{'open': fechaAbierta === grupo.fecha}" @click="toggleFecha(grupo.fecha)">
                                        <div class="date-left">
                                            <svg class="chev" :class="{'open': fechaAbierta === grupo.fecha}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M9 5l7 7-7 7"></path></svg>
                                            <div>
                                                <p class="date-title" x-text="formatearFechaLarga(grupo.fecha)"></p>
                                                <p class="date-sub" x-text="`${grupo.items.length} ${grupo.items.length === 1 ? 'gasto' : 'gastos'}`"></p>
                                            </div>
                                        </div>
                                        <div class="date-right">
                                            <p class="date-total" x-text="formatearMoneda(grupo.total)"></p>
                                        </div>
                                    </div>

                                    <!-- Gastos de esa fecha -->
                                    <div class="date-body" x-show="fechaAbierta === grupo.fecha" x-transition>
                                        <template x-for="gasto in grupo.items" :key="gasto.id">
                                            <div class="row">
                                                <div class="row-left">
                                                    <div class="cat-icon" :class="obtenerColorConcepto(gasto.concept)" x-text="obtenerIconoConcepto(gasto.concept)"></div>
                                                    <div class="row-info">
                                                        <p class="concept" x-text="gasto.concept"></p>
                                                        <p class="notes" x-show="gasto.notes" x-text="gasto.notes"></p>
                                                    </div>
                                                </div>
                                                <span class="money" x-text="formatearMoneda(gasto.amount)"></span>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- ===== VISTA CORRERIAS ===== -->
        <div class="layout" x-show="vista === 'correrias'" style="display:none">
            <!-- Lista de correrías -->
            <div class="card">
                <div class="panel-head">
                    <h2>Correrías</h2>
                    <button class="btn-add" @click="toggleFormCorreria()">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" d="M12 4v16m8-8H4"></path></svg>
                        <span x-text="mostrarFormCorreria ? 'Cerrar' : 'Nueva'"></span>
                    </button>
                </div>

                <!-- Formulario crear correría -->
                <div class="create-box" x-show="mostrarFormCorreria" x-transition style="display:none">
                    <div class="form-error" x-show="formCorreriaError" x-text="formCorreriaError"></div>
                    <form @submit.prevent="crearCorreria()">
                        <div class="field">
                            <label class="fl">Nombre de la correría</label>
                            <input type="text" class="mini" x-model="nuevaCorreria.name" placeholder="Ej. Correría Septiembre" required>
                        </div>
                        <div class="mini-row field">
                            <div>
                                <label class="fl">Inicio</label>
                                <input type="date" class="mini" x-model="nuevaCorreria.start_date">
                            </div>
                            <div>
                                <label class="fl">Fin</label>
                                <input type="date" class="mini" x-model="nuevaCorreria.end_date">
                            </div>
                        </div>
                        <button type="submit" class="btn-mini" x-text="creandoCorreria ? 'Creando…' : 'Crear correría'"></button>
                    </form>
                </div>

                <div x-show="correrias.length === 0" class="msg">No hay correrías. Crea la primera.</div>
                <ul class="list custom-scrollbar">
                    <template x-for="(c, idx) in correrias" :key="c.id">
                        <li @click="seleccionarCorreria(c)" class="traveler" :class="{'active': correriaSeleccionada?.id === c.id}">
                            <div class="top">
                                <div style="min-width:0">
                                    <p class="name" x-text="c.name"></p>
                                    <p class="dates" x-text="rangoFechas(c)"></p>
                                </div>
                                <div style="display:flex;align-items:center;gap:10px">
                                    <div style="text-align:right">
                                        <p class="amount" x-text="formatearMoneda(c.total)"></p>
                                        <p class="delta" :class="deltaClase(idx)" x-show="idx > 0" x-text="deltaTexto(idx)"></p>
                                        <p class="cnt" x-show="idx === 0" x-text="`${c.count} gastos`"></p>
                                    </div>
                                    <button class="del-traveler" @click.stop="borrarCorreria(c)" title="Borrar correría">
                                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    </button>
                                </div>
                            </div>
                        </li>
                    </template>
                </ul>
            </div>

            <!-- Detalle de correría -->
            <div class="card">
                <template x-if="!correriaSeleccionada">
                    <div class="empty">
                        <span class="em">🗺️</span>
                        <p>Selecciona una correría</p>
                        <span>Para ver sus gastos y compararla con la anterior.</span>
                    </div>
                </template>

                <template x-if="correriaSeleccionada">
                    <div style="display:flex;flex-direction:column;height:100%">
                        <div class="detail-head">
                            <div>
                                <h2 x-text="correriaSeleccionada.name"></h2>
                                <p class="movs" x-text="`${gastosCorreria.length} gastos · ${rangoFechas(correriaSeleccionada)}`"></p>
                            </div>
                            <div>
                                <p class="tot-lbl">Total Correría</p>
                                <p class="tot-val" x-text="formatearMoneda(correriaSeleccionada.total)"></p>
                            </div>
                        </div>

                        <!-- Comparación con la correría anterior -->
                        <template x-if="correriaAnterior()">
                            <div class="compare">
                                <div class="compare-head">
                                    <span>vs <b x-text="correriaAnterior().name"></b></span>
                                    <span class="compare-total" :class="comparacionSel()?.clase" x-text="comparacionSel()?.texto"></span>
                                </div>
                                <template x-for="cat in categoriasComparacion()" :key="cat.nombre">
                                    <div class="compare-row">
                                        <span class="c-cat" x-text="cat.nombre"></span>
                                        <span class="c-prev" x-text="formatearMoneda(cat.anterior)"></span>
                                        <span class="c-arrow" :class="cat.clase" x-text="cat.flecha"></span>
                                        <span class="c-now" x-text="formatearMoneda(cat.actual)"></span>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template x-if="!correriaAnterior()">
                            <div class="compare"><p class="compare-none">Es la primera correría: no hay anterior para comparar.</p></div>
                        </template>

                        <!-- Gastos de la correría -->
                        <div class="list custom-scrollbar">
                            <div x-show="gastosCorreria.length === 0" class="msg">Sin gastos en esta correría.</div>
                            <template x-for="g in gastosCorreria" :key="g.id">
                                <div class="row">
                                    <div class="row-left">
                                        <div class="cat-icon" :class="obtenerColorConcepto(g.concept)" x-text="obtenerIconoConcepto(g.concept)"></div>
                                        <div class="row-info">
                                            <p class="concept" x-text="g.concept"></p>
                                            <p class="notes"><b x-text="g.traveler_name"></b> · <span x-text="formatearFecha(g.date)"></span><span x-show="g.notes" x-text="` · ${g.notes}`"></span></p>
                                        </div>
                                    </div>
                                    <span class="money" x-text="formatearMoneda(g.amount)"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
    </div>

    <script>
        function adminApp() {
            return {
                viajeros: [],
                viajeroSeleccionado: null,
                gastosActivos: [],
                fechaAbierta: null,
                mostrarForm: false,
                creando: false,
                formError: '',
                // Sesión de administrador
                autenticado: false,
                adminKey: '',
                loginPassword: '',
                loginError: '',
                verificando: false,
                nuevoViajero: {
                    name: '',
                    departure_date: new Date().toISOString().split('T')[0],
                    arrival_date: new Date().toISOString().split('T')[0]
                },
                // Correrías
                vista: 'viajeros',
                correrias: [],
                correriaSeleccionada: null,
                gastosCorreria: [],
                mostrarFormCorreria: false,
                creandoCorreria: false,
                formCorreriaError: '',
                nuevaCorreria: { name: '', start_date: '', end_date: '' },

                initApp() {
                    // Recuperar sesión previa
                    const guardada = sessionStorage.getItem('adminKey');
                    if (guardada) {
                        this.adminKey = guardada;
                        this.autenticado = true;
                        this.cargarResumen();
                        this.cargarCorrerias();
                    }
                },

                async login() {
                    this.loginError = '';
                    if (!this.loginPassword) { this.loginError = 'Ingresa la clave.'; return; }
                    this.verificando = true;
                    try {
                        const res = await fetch('/api/admin/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ password: this.loginPassword })
                        });
                        if (!res.ok) { this.loginError = 'Clave incorrecta. Intenta de nuevo.'; return; }
                        this.adminKey = this.loginPassword;
                        sessionStorage.setItem('adminKey', this.adminKey);
                        this.autenticado = true;
                        this.loginPassword = '';
                        this.cargarResumen();
                        this.cargarCorrerias();
                    } catch (e) {
                        this.loginError = 'Error de conexión con el servidor.';
                    } finally {
                        this.verificando = false;
                    }
                },

                logout() {
                    sessionStorage.removeItem('adminKey');
                    this.autenticado = false;
                    this.adminKey = '';
                    this.viajeros = [];
                    this.viajeroSeleccionado = null;
                    this.gastosActivos = [];
                },

                async cargarResumen() {
                    try {
                        const res = await fetch('/api/admin/summary', {
                            headers: { 'x-admin-password': this.adminKey }
                        });
                        if (res.status === 401) { this.logout(); return; }
                        this.viajeros = await res.json();
                    } catch (e) { console.error("Error cargando resumen", e); }
                },

                // ===== Correrías =====
                async cargarCorrerias() {
                    try {
                        const res = await fetch('/api/admin/correrias/summary', { headers: { 'x-admin-password': this.adminKey } });
                        if (res.status === 401) { this.logout(); return; }
                        this.correrias = await res.json();
                        // refrescar la seleccionada con datos nuevos
                        if (this.correriaSeleccionada) {
                            const act = this.correrias.find(c => c.id === this.correriaSeleccionada.id);
                            this.correriaSeleccionada = act || null;
                            if (!act) this.gastosCorreria = [];
                        }
                    } catch (e) { console.error("Error cargando correrías", e); }
                },

                async seleccionarCorreria(c) {
                    this.correriaSeleccionada = c;
                    try {
                        const res = await fetch(`/api/admin/correrias/${c.id}/expenses`, { headers: { 'x-admin-password': this.adminKey } });
                        if (res.status === 401) { this.logout(); return; }
                        this.gastosCorreria = await res.json();
                    } catch (e) { console.error("Error cargando gastos de correría", e); }
                },

                toggleFormCorreria() {
                    this.mostrarFormCorreria = !this.mostrarFormCorreria;
                    this.formCorreriaError = '';
                },

                async crearCorreria() {
                    this.formCorreriaError = '';
                    this.creandoCorreria = true;
                    try {
                        const res = await fetch('/api/admin/correrias', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'x-admin-password': this.adminKey },
                            body: JSON.stringify(this.nuevaCorreria)
                        });
                        const data = await res.json();
                        if (res.status === 401) { this.formCorreriaError = 'Sesión expirada. Vuelve a entrar.'; this.logout(); return; }
                        if (!res.ok) { this.formCorreriaError = data.error || 'No se pudo crear la correría.'; return; }
                        this.nuevaCorreria = { name: '', start_date: '', end_date: '' };
                        this.mostrarFormCorreria = false;
                        await this.cargarCorrerias();
                    } catch (e) {
                        this.formCorreriaError = 'Error de conexión con el servidor.';
                    } finally {
                        this.creandoCorreria = false;
                    }
                },

                async borrarCorreria(c) {
                    if (!confirm(`¿Borrar la correría "${c.name}"? Los gastos quedarán sin correría asignada.`)) return;
                    try {
                        const res = await fetch(`/api/admin/correrias/${c.id}`, {
                            method: 'DELETE',
                            headers: { 'x-admin-password': this.adminKey }
                        });
                        if (res.status === 401) { alert('Sesión expirada. Vuelve a entrar.'); this.logout(); return; }
                        if (!res.ok) { alert('No se pudo borrar la correría.'); return; }
                        if (this.correriaSeleccionada?.id === c.id) { this.correriaSeleccionada = null; this.gastosCorreria = []; }
                        await this.cargarCorrerias();
                    } catch (e) { alert('Error de conexión con el servidor.'); }
                },

                // La correría anterior (cronológicamente) a la seleccionada
                correriaAnterior() {
                    if (!this.correriaSeleccionada) return null;
                    const i = this.correrias.findIndex(c => c.id === this.correriaSeleccionada.id);
                    return i > 0 ? this.correrias[i - 1] : null;
                },

                // Comparación de totales: correría idx vs la anterior
                _comparar(cur, prev) {
                    const diff = cur - prev;
                    const pct = prev > 0 ? Math.round(diff / prev * 100) : (cur > 0 ? 100 : 0);
                    const flecha = diff > 0 ? '▲' : (diff < 0 ? '▼' : '■');
                    return {
                        diff, pct, flecha,
                        clase: diff > 0 ? 'up' : (diff < 0 ? 'down' : 'flat'),
                        claseTxt: diff > 0 ? 'up-txt' : (diff < 0 ? 'down-txt' : 'flat-txt'),
                        texto: `${flecha} ${this.formatearMoneda(Math.abs(diff))} (${pct > 0 ? '+' : ''}${pct}%)`
                    };
                },

                deltaTexto(idx) {
                    if (idx < 1 || !this.correrias[idx - 1]) return '';
                    return this._comparar(this.correrias[idx].total, this.correrias[idx - 1].total).texto;
                },
                deltaClase(idx) {
                    if (idx < 1 || !this.correrias[idx - 1]) return 'flat';
                    return this._comparar(this.correrias[idx].total, this.correrias[idx - 1].total).clase;
                },

                comparacionSel() {
                    const prev = this.correriaAnterior();
                    if (!prev) return null;
                    const info = this._comparar(this.correriaSeleccionada.total, prev.total);
                    return { texto: info.texto, clase: info.claseTxt };
                },

                // Comparación por categoría entre la correría seleccionada y la anterior
                categoriasComparacion() {
                    const sel = this.correriaSeleccionada;
                    const prev = this.correriaAnterior();
                    if (!sel) return [];
                    const catsSel = sel.categorias || {};
                    const catsPrev = (prev && prev.categorias) || {};
                    const nombres = [...new Set([...Object.keys(catsSel), ...Object.keys(catsPrev)])].sort();
                    return nombres.map(n => {
                        const actual = catsSel[n] || 0;
                        const anterior = catsPrev[n] || 0;
                        const diff = actual - anterior;
                        return {
                            nombre: n, actual, anterior,
                            flecha: diff > 0 ? '▲' : (diff < 0 ? '▼' : '■'),
                            clase: diff > 0 ? 'up-txt' : (diff < 0 ? 'down-txt' : 'flat-txt')
                        };
                    });
                },

                rangoFechas(c) {
                    if (!c.start_date && !c.end_date) return 'Sin fechas';
                    return `${this.formatearFecha(c.start_date)} — ${this.formatearFecha(c.end_date)}`;
                },

                toggleForm() {
                    this.mostrarForm = !this.mostrarForm;
                    this.formError = '';
                },

                async crearViajero() {
                    this.formError = '';
                    this.creando = true;
                    try {
                        const res = await fetch('/api/admin/travelers', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json', 'x-admin-password': this.adminKey },
                            body: JSON.stringify(this.nuevoViajero)
                        });
                        const data = await res.json();
                        if (res.status === 401) { this.formError = 'Sesión expirada. Vuelve a entrar.'; this.logout(); return; }
                        if (!res.ok) { this.formError = data.error || 'No se pudo crear el viajero.'; return; }
                        this.nuevoViajero.name = '';
                        this.mostrarForm = false;
                        await this.cargarResumen();
                    } catch (e) {
                        this.formError = 'Error de conexión con el servidor.';
                    } finally {
                        this.creando = false;
                    }
                },

                async borrarViajero(v) {
                    if (!confirm(`¿Borrar a "${v.name}" y todos sus gastos? Esta acción no se puede deshacer.`)) return;
                    try {
                        const res = await fetch(`/api/admin/travelers/${v.id}`, {
                            method: 'DELETE',
                            headers: { 'Content-Type': 'application/json', 'x-admin-password': this.adminKey }
                        });
                        const data = await res.json();
                        if (res.status === 401) { alert('Sesión expirada. Vuelve a entrar.'); this.logout(); return; }
                        if (!res.ok) { alert(data.error || 'No se pudo borrar el viajero.'); return; }
                        if (this.viajeroSeleccionado?.id === v.id) {
                            this.viajeroSeleccionado = null;
                            this.gastosActivos = [];
                        }
                        await this.cargarResumen();
                    } catch (e) {
                        alert('Error de conexión con el servidor.');
                    }
                },

                async seleccionarViajero(viajero) {
                    this.viajeroSeleccionado = viajero;
                    this.fechaAbierta = null;
                    try {
                        const res = await fetch(`/api/travelers/${viajero.id}/expenses`);
                        this.gastosActivos = await res.json();
                    } catch (e) { console.error("Error cargando gastos", e); }
                },

                // Agrupa los gastos por fecha (más reciente primero)
                gastosPorFecha() {
                    const grupos = {};
                    this.gastosActivos.forEach(g => {
                        (grupos[g.date] = grupos[g.date] || []).push(g);
                    });
                    return Object.keys(grupos)
                        .sort((a, b) => b.localeCompare(a))
                        .map(fecha => ({
                            fecha,
                            items: grupos[fecha],
                            total: grupos[fecha].reduce((s, x) => s + parseFloat(x.amount), 0)
                        }));
                },

                toggleFecha(fecha) {
                    this.fechaAbierta = this.fechaAbierta === fecha ? null : fecha;
                },

                formatearMoneda(valor) {
                    return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(valor || 0);
                },

                formatearFecha(fechaString) {
                    if (!fechaString) return '';
                    const [year, month, day] = fechaString.split('-');
                    return new Date(year, month - 1, day).toLocaleDateString('es-CO', { year: 'numeric', month: 'short', day: 'numeric' });
                },

                formatearFechaLarga(fechaString) {
                    if (!fechaString) return '';
                    const [year, month, day] = fechaString.split('-');
                    return new Date(year, month - 1, day).toLocaleDateString('es-CO', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
                },

                obtenerIconoConcepto(concepto) {
                    const iconos = { 'Alimentacion': '🍽️', 'Transporte': '🚌', 'Alojamiento': '🏨', 'Representacion': '🤝', 'Otros': '📦' };
                    return iconos[concepto] || '📝';
                },

                obtenerColorConcepto(concepto) {
                    const colores = { 'Alimentacion': 'cat-alimentacion', 'Transporte': 'cat-transporte', 'Alojamiento': 'cat-alojamiento', 'Representacion': 'cat-representacion', 'Otros': 'cat-otros' };
                    return colores[concepto] || 'cat-default';
                }
            }
        }
    </script>
</body>
</html>
